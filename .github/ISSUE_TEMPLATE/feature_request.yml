name: Feature request
description: Suggest an improvement for SELZ80Trainer
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Motivation
      description: What problem or limitation should this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe alternatives or workarounds you considered.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add screenshots, references or hardware/manual details if useful.
